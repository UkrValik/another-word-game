name: CD-DEV-MONOLITH

on: 
  workflow_dispatch:
    inputs:
        tag:
          required: true
          type: string

jobs:
  deploy-apps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Deploy with script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_KEY }}
          port: ${{ secrets.PORT }}
          script_path: 
