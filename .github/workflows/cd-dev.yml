name: CD-DEV

on: workflow_dispatch

jobs:
  deploy-apps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Connect to cluster
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DEV_CLUSTER_ID }}

      - name: Use awg namespace
        run: kubectl config set-context --curent --namespace awg

      - name: Deploy Account
        working-directory: awg-backend
        run: kubectl apply -f deploy/account-deploy-k8s.yml

      - name: Verify Account
        run: kubectl get pods
